[project]
site_name = "3MS"
site_url = "https://3ms.3dcoded.xyz/"
repo_url = "https://github.com/3dcoded/3MS"
copyright = "Copyright &copy; 2024-2026 Christopher Mattar (3DCoded)"

nav = [
    { "Home" = "index.md" },
    "compare.md",
    "tips.md",
    { "Instructions" = [
        "instructions/index.md",
        { "BOM" = "instructions/bom.md" },
        { "Printed Parts & Tools" = "instructions/printed-parts-and-tools.md" },
        { "Hardware Assembly" = "instructions/hardware-assembly.md" },
        { "Electronic Assembly" = "instructions/electronic-assembly.md" },
        { "Final Assembly" = "instructions/final-assembly.md" },
        { "Software Setup" = "instructions/software-setup.md" },
        { "Configuration" = "instructions/config.md" },
        { "Calibration" = "instructions/calibration.md" },
        { "First Print" = "instructions/firstprint.md" },
    ] },
    { "Other Boards" = [
        "controllers/index.md",
        "controllers/skrpico.md",
        "controllers/index.md",
        "controllers/bttmmb.md",
        "controllers/skrminie3v2.md",
        "controllers/bttoctopusmain.md",
        "controllers/einsyrambo-skrminie3v2.md",
        "controllers/zm384main.md",
        "controllers/minirambo.md",
        "controllers/mellowflyd7.md",
        "controllers/geetech-a30t.md",
    ] },
    { "Kits" = [
        "kits/index.md",
        { "Tour" = "kits/tour.md" },
    ] },
    { "Guides" = [
        { "Printers" = [
            { "Creality K1/E3v3 Series" = "guides/printers/creality.md" },
        ] },
        "guides/generator.md",
        "guides/steppercurrent.md",
    ] },
    { "Contributing" = [
        "contributing/index.md",
        "contributing/devsetup.md",
    ] },
]

extra_css = [
    "stylesheets/extra.css",
    "assets/css/calibration.css",
]

extra_javascript = [
    "assets/javascript/calibration.js",
]


# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------

[project.plugins.search]

[project.plugins.meta-descriptions]
export_csv = false
quiet = false
enable_checks = false
min_length = 50
max_length = 160
trim = false
fallback_if_short = false

[project.plugins.macros]

[project.plugins.glightbox]

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------

[project.markdown_extensions]
pymdownx.critic = {}
pymdownx.caret = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.snippets = {}
pymdownx.tilde = {}
admonition = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.auto_title = false
pymdownx.highlight.linenums = true
pymdownx.inlinehilite = {}
pymdownx.blocks.caption = {}
pymdownx.tasklist.custom_checkbox = true
abbr = {}
attr_list = {}
md_in_html = {}

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid" }
]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true


# ---------------------------------------------------------------------------
# Extra
# ---------------------------------------------------------------------------

[project.extra.analytics]
provider = "google"
property = "G-ERRF9DWVTD"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/ekqxDhdGCg"
name = "Discord"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/3DCoded/3MS"
name = "GitHub"

[project.extra.status]
new = "Recently added"
updated = "Recently updated"
deprecated = "Deprecated"


# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------

[project.theme]
name = "material"
variant = "modern"
language = "en"
logo = "assets/logo.png"
favicon = "assets/logo.png"
custom_dir = "docs/overrides"

features = [
    "navigation.indexes",
    "navigation.footer",
    "navigation.instant",
    "navigation.top",
    # "navigation.sections",
    "navigation.instant.prefetch",
    "search.suggest",
    "search.highlight",
    "search.share",
    "content.tooltips",
    "content.code.copy",
    "content.tabs.link",
]

# Palette toggle for light mode
[[project.theme.palette]]
scheme = "default"
primary = "blue"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
scheme = "slate"
primary = "blue"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"